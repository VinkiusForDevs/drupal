vinkius_connector.admin:
  path: '/admin/config/vinkius'
  defaults:
    _controller: '\Drupal\vinkius_connector\Controller\VinkiusController::admin'
    _title: 'Vinkius'
  requirements:
    _permission: 'administer vinkius connector'

vinkius_connector.consent:
  path: '/vinkius/consent'
  defaults:
    _controller: '\Drupal\vinkius_connector\Controller\VinkiusController::consent'
    _title: 'AI agent consent'
  requirements:
    _access: 'TRUE'

vinkius_connector.ajax:
  path: '/vinkius/ajax'
  defaults:
    _controller: '\Drupal\vinkius_connector\Controller\AjaxController::handle'
    _title: 'Vinkius AJAX'
  requirements:
    _access: 'TRUE'
  methods: [GET, POST]
